<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Learning System</title>
    <link rel="stylesheet" href="account-login.css">
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        <p style="color: #718096; margin-bottom: 30px; font-size: 14px; line-height: 1.5;">
            Please enter the student ID and phone number you used during registration. We will help you reset your password.
        </p>
        <form id="forgot-password-form">
            <div class="input-group">
                <label for="userid">Student ID</label>
                <input type="text" id="userid" placeholder="Enter your registered student ID" required>
                <span id="us-error-message" class="error-message"></span>
            </div>
            
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter the phone number you registered with" required>
                <span id="ph-error-message" class="error-message"></span>
            </div>
            
            <button type="submit" class="button">
                <span class="button-text">Verify Identity</span>
            </button>
            
            <div id="success-message" class="success-message"></div>
        </form>
        
        <div class="auth-links">
            <p>
                Remembered your password? <a href="login.html">Return to Login</a><br>
                No account? <a href="register.html">Register Now</a>
            </p>
        </div>
    </div>
    
    <script src="../database.js"></script>
    <script src="account.js"></script>
    <script>
        // 进入重置密码界面时，清空当前重置密码的用户id
        localStorage.removeItem('resetPassword');

        // 当离开用户id输入框时，验证是否填写用户id
        document.getElementById('userid').addEventListener('blur', () => {
            checkUserid();
        });

        // 当离开手机号输入框时，验证是否填写手机号
        document.getElementById('phone').addEventListener('blur', () => {
            checkPhone();
        });

        document.getElementById('forgot-password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const button = e.target.querySelector('button');
            const buttonText = button.querySelector('.button-text');
            const userid = document.getElementById('userid').value;
            const phone = document.getElementById('phone').value;

            // 检验是否填写信息
            if (!checkUserid() || !checkPhone()) {
                return;
            }

            // 显示加载状态
            button.classList.add('loading');
            button.disabled = true;
            buttonText.textContent = '验证中...';

            // 模拟网络延迟
            setTimeout(() => {
                // 检验用户id是否存在
                const item = JSON.parse(localStorage.getItem(userid));
                if (!item) {
                    document.getElementById('us-error-message').textContent = 'This student ID does not exist.';
                    resetButtonState();
                    return;
                }

                // 检验手机号是否正确
                if (item.phone !== phone) {
                    document.getElementById('ph-error-message').textContent = 'Phone number does not match registration info.';
                    resetButtonState();
                    return;
                }

                // 清空错误信息
                document.getElementById('us-error-message').textContent = '';
                document.getElementById('ph-error-message').textContent = '';

                // 显示成功信息
                document.getElementById('success-message').textContent = 'Identity verified! Redirecting to password reset page...';

                // 将需要修改密码的用户id存入localStorage，然后跳转到新密码设置页面
                localStorage.setItem('resetPassword', userid);
                
                setTimeout(() => {
                    window.location.href = 'set-new-password.html';
                }, 2000);
            }, 1000);
        });

        // 重置按钮状态
        function resetButtonState() {
            const button = document.querySelector('button');
            const buttonText = button.querySelector('.button-text');
            button.classList.remove('loading');
            button.disabled = false;
            buttonText.textContent = 'Verify Identity';
        }

        // 添加输入框动画效果
        document.querySelectorAll('.input-group input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
        });
    </script>
</body>
</html>
