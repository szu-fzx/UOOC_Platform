<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Settings - Teacher Module</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../header-footer/images/ico.png" type="image/x-icon">
    <link rel="stylesheet" href="../header-footer/common.css">
    <link rel="stylesheet" href="account-styles.css">
</head>
<body>
    <!-- Header -->
    <header class="navbar">
        <div class="nav">
            <div class="logo">
                <a href="../Homepage/WebsiteHomepage.html"><img src="../header-footer/images/logo.png" alt="UOOC Alliance"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="../Homepage/WebsiteHomepage.html">Home</a></li>
                    <li><a href="../Homepage/courseList.html">Courses</a></li>
                    <li><a href="../Homepage/league.html">Alliance Universities</a></li>
                    <li><a href="../Homepage/about-us.html">About Us</a></li>
                </ul>
            </nav>
        </div>
        <div class="info">
            <!-- User info will be filled by JavaScript -->
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-5 main-content">
        <ul class="nav nav-tabs" id="teacherTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="true">
                    <i class="bi bi-person-fill me-2"></i>Profile
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="password-tab" data-bs-toggle="tab" data-bs-target="#password-tab-pane" type="button" role="tab" aria-controls="password-tab-pane" aria-selected="false">
                    <i class="bi bi-lock-fill me-2"></i>Change Password
                </button>
            </li>
        </ul>

        <div class="tab-content" id="teacherTabContent">
            <!-- Profile -->
            <div class="tab-pane fade show active" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
                <form id="profile-form" class="profile-form">
                    <!-- Avatar -->
                    <div class="mb-4 text-center">
                        <div id="avatar-container" class="mx-auto">
                            <img id="avatar-img" src="../header-footer/images/user-head.jpg">
                            <div id="avatar-overlay">
                                <i class="bi bi-camera-fill"></i>
                            </div>
                            <input type="file" id="change-avatar" style="display:none;" accept="image/*" />
                        </div>
                        <p class="text-muted small mt-2">Click to change avatar</p>
                    </div>

                    <div class="row g-4">
                        <!-- Teacher ID -->
                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-hash me-2"></i>Teacher ID</label>
                            <div class="form-control-plaintext" id="teacher-id"></div>
                        </div>

                        <!-- Name -->
                        <div class="col-md-6">
                            <label for="teacher-name" class="form-label"><i class="bi bi-person me-2"></i>Full Name</label>
                            <input type="text" class="form-control" id="teacher-name" required placeholder="Enter your name">
                        </div>

                        <!-- Gender -->
                        <div class="col-md-12">
                            <label class="form-label d-block"><i class="bi bi-gender-ambiguous me-2"></i>Gender</label>
                            <div class="d-flex">
                                <div class="form-check">
                                    <input class="form-check-input" id="male" type="radio" name="gender" value="Male">
                                    <label class="form-check-label" for="male">Male</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" id="female" type="radio" name="gender" value="Female">
                                    <label class="form-check-label" for="female">Female</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" id="private" type="radio" name="gender" value="Prefer not to say">
                                    <label class="form-check-label" for="private">Private</label>
                                </div>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="col-md-6">
                            <label for="teacher-phone" class="form-label"><i class="bi bi-telephone me-2"></i>Phone Number</label>
                            <input type="text" class="form-control" id="teacher-phone" required placeholder="Enter phone number">
                            <span id="phone-error-message" class="text-danger"></span>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label for="teacher-email" class="form-label"><i class="bi bi-envelope me-2"></i>Email Address</label>
                            <input type="email" class="form-control" id="teacher-email" placeholder="Enter email address">
                            <span id="email-error-message" class="text-danger"></span>
                        </div>

                        <!-- School -->
                        <div class="col-md-6">
                            <label for="teacher-school" class="form-label"><i class="bi bi-building me-2"></i>University / School</label>
                            <input type="text" class="form-control" id="teacher-school" placeholder="Enter school name">
                        </div>

                        <!-- Subject -->
                        <div class="col-md-6">
                            <label for="teacher-subject" class="form-label"><i class="bi bi-book me-2"></i>Subject</label>
                            <input type="text" class="form-control" id="teacher-subject" placeholder="Enter teaching subject">
                        </div>

                        <!-- Bio -->
                        <div class="col-md-12">
                            <label for="teacher-bio" class="form-label"><i class="bi bi-chat-quote me-2"></i>Biography</label>
                            <textarea class="form-control" id="teacher-bio" rows="4" placeholder="Write something about yourself..."></textarea>
                        </div>

                        <!-- Save Button -->
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-check-lg me-2"></i>Save Profile Changes
                            </button>
                            <div id="profile-success-message" class="mt-3 alert alert-success" style="display: none;"></div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Change Password -->
            <div class="tab-pane fade" id="password-tab-pane" role="tabpanel" aria-labelledby="password-tab" tabindex="0">
                <form id="reset-password-form" class="profile-form max-width-500 mx-auto">
                    <div class="mb-4">
                        <label for="old-password" class="form-label"><i class="bi bi-shield-lock me-2"></i>Current Password</label>
                        <input type="password" class="form-control" id="old-password" placeholder="••••••••" required>
                        <span id="old-password-error" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-4">
                        <label for="new-password" class="form-label"><i class="bi bi-key me-2"></i>New Password</label>
                        <input type="password" class="form-control" id="new-password" placeholder="••••••••" required>
                        <span id="new-password-error" class="text-danger"></span>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm-new-password" class="form-label"><i class="bi bi-key-fill me-2"></i>Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm-new-password" placeholder="••••••••" required>
                        <span id="confirm-password-error" class="text-danger"></span>
                    </div>

                    <div class="mt-5">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-shield-check me-2"></i>Update Password
                        </button>
                        <div id="password-success-message" class="mt-3 alert alert-success" style="display: none;"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <div class="footer-content">
            <div class="footer-logo">
                <a href="../Homepage/WebsiteHomepage.html"><img src="../header-footer/images/logo.png" alt="UOOC Alliance"></a>
            </div>
            <div class="footer-text">
                <nav class="footer-nav">
                    <ul>
                        <li><a href="../Homepage/about-us.html">About Us</a></li>
                        <li><a href="../Homepage/contact.html">Contact Us</a></li>
                        <li><a href="../Homepage/privacy.html">Privacy Policy</a></li>
                        <li><a href="../Homepage/terms.html">Terms of Service</a></li>
                    </ul>
                </nav>
                <div class="footer-info">
                    <p>&copy; 2025 UOOC Alliance. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../database.js"></script>
    <script src="account.js"></script>
    
    <!-- 页面初始化脚本 -->
    <script>
        // 页面加载时初始化用户信息
        window.onload = function() {
            initializeUserInfo();
            initializeTeacherProfile();
        }

        // 初始化用户信息显示
        function initializeUserInfo() {
            const userid = localStorage.getItem('token');
            if(userid) {
                const user = JSON.parse(localStorage.getItem(userid));
                document.querySelector('.info').innerHTML = `
                    <a href="../teacher/teacher-profile.html"><img id="user-head" src="${user.avatar}" alt="User Avatar"></a>
                    <div class="card">
                        <ul>
                            <li><a href="../teacher/teacher-profile.html">Profile Center</a></li>
                            <li><a href="../account/teacher-setting.html">Account Settings</a></li>
                            <li><a id="logout" href="#logout">Logout</a></li>
                        </ul>
                    </div>
                `;
                // 退出登录功能
                document.getElementById('logout').addEventListener('click', () => {
                    localStorage.removeItem('token');
                    window.location.href = '../Homepage/WebsiteHomepage.html';
                });
            } else {
                document.querySelector('.info').innerHTML = `
                    <a href="../account/login.html"><button class="login">登录</button></a>
                    <a href="../account/register.html"><button class="register">注册</button></a>
                `;
                // 如果没有登录，跳转到登录页面
                alert('Please login first!');
                window.location.href = '../account/login.html';
            }
        }

        // 初始化教师个人信息
        function initializeTeacherProfile() {
            const userid = localStorage.getItem('token');
            if(!userid) return;
            
            const teacher = JSON.parse(localStorage.getItem(userid));
            if(!teacher) return;

            // 填充个人信息表单
            document.getElementById('avatar-img').src = teacher.avatar || '../header-footer/images/user-head.jpg';
            document.getElementById('teacher-id').textContent = teacher.userid;
            document.getElementById('teacher-name').value = teacher.username || '';
            
            // 设置性别单选框
            if(teacher.gender === 'Male' || teacher.gender === 'Male') {
                document.getElementById('male').checked = true;
            } else if(teacher.gender === 'Female' || teacher.gender === 'Female') {
                document.getElementById('female').checked = true;
            } else {
                document.getElementById('private').checked = true;
            }
            
            document.getElementById('teacher-phone').value = teacher.phone || '';
            document.getElementById('teacher-email').value = teacher.email || '';
            document.getElementById('teacher-school').value = teacher.school || '';
            document.getElementById('teacher-subject').value = teacher.subject || '';
            document.getElementById('teacher-bio').value = teacher.bio || '';
        }

        // 显示提示信息
        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                if(alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 3000);
        }
    </script>

    <!-- 个人信息表单处理脚本 -->
    <script>
        // 头像上传功能
        document.getElementById('avatar-container').addEventListener('click', () => {
            document.getElementById('change-avatar').click();
        });

        document.getElementById('change-avatar').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatar-img').src = e.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 手机号验证
        document.getElementById('teacher-phone').addEventListener('blur', () => {
            const phone = document.getElementById('teacher-phone').value;
            validatePhone(phone);
        });

        // 邮箱验证
        document.getElementById('teacher-email').addEventListener('blur', () => {
            const email = document.getElementById('teacher-email').value;
            validateEmail(email);
        });

        // 个人信息表单提交
        document.getElementById('profile-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('teacher-phone').value;
            const email = document.getElementById('teacher-email').value;
            
            // 验证必填字段
            if(!validatePhone(phone) || !validateEmail(email)) return;
            
            const userid = localStorage.getItem('token');
            let teacher = JSON.parse(localStorage.getItem(userid));
            
            // 更新教师信息
            teacher.avatar = document.getElementById('avatar-img').src;
            teacher.username = document.getElementById('teacher-name').value;
            teacher.gender = document.querySelector('input[name="gender"]:checked').value;
            teacher.phone = phone;
            teacher.email = email;
            teacher.school = document.getElementById('teacher-school').value;
            teacher.subject = document.getElementById('teacher-subject').value;
            teacher.bio = document.getElementById('teacher-bio').value;
            
            // 保存到localStorage
            localStorage.setItem(userid, JSON.stringify(teacher));
            
            // 显示成功消息
            const successMsg = document.getElementById('profile-success-message');
            successMsg.textContent = 'Profile saved successfully!';
            successMsg.style.display = 'block';
            
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        });

        // 手机号验证函数
        function validatePhone(phone) {
            const phoneRegex = /^1[3-9]\d{9}$/;
            const errorElement = document.getElementById('phone-error-message');
            
            if(!phone) {
                errorElement.textContent = 'Phone number cannot be empty';
                return false;
            }
            
            if(!phoneRegex.test(phone)) {
                errorElement.textContent = 'Please enter a valid phone number';
                return false;
            }
            
            errorElement.textContent = '';
            return true;
        }

        // 邮箱验证函数
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const errorElement = document.getElementById('email-error-message');
            
            if(email && !emailRegex.test(email)) {
                errorElement.textContent = 'Please enter a valid email address';
                return false;
            }
            
            errorElement.textContent = '';
            return true;
        }

        // 学生注册开关
        // 已移除该页面的冗余逻辑，该功能应在 teacher-profile.html 中处理
    </script>

    <!-- 密码修改脚本 -->
    <script>
        // 密码输入框验证
        document.getElementById('old-password').addEventListener('blur', validateOldPassword);
        document.getElementById('new-password').addEventListener('blur', validateNewPassword);
        document.getElementById('confirm-new-password').addEventListener('blur', validateConfirmPassword);

        // 密码修改表单提交
        document.getElementById('reset-password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            if(!validateOldPassword() || !validateNewPassword() || !validateConfirmPassword()) {
                return;
            }
            
            const userid = localStorage.getItem('token');
            let teacher = JSON.parse(localStorage.getItem(userid));
            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;
            
            // 验证新密码一致性
            if(newPassword !== confirmPassword) {
                document.getElementById('confirm-password-error').textContent = 'Passwords do not match';
                return;
            }
            
            // 验证原密码正确性
            if(simpleHash(oldPassword, userid) !== teacher.password) {
                document.getElementById('old-password-error').textContent = 'Incorrect current password';
                return;
            }
            
            // 更新密码
            teacher.password = simpleHash(newPassword, userid);
            localStorage.setItem(userid, JSON.stringify(teacher));
            
            // 显示成功消息
            const successMsg = document.getElementById('password-success-message');
            successMsg.textContent = 'Password changed successfully! Please login again.';
            successMsg.style.display = 'block';
            
            // 清空表单
            document.getElementById('reset-password-form').reset();
            
            // 2秒后跳转到登录页面
            setTimeout(() => {
                localStorage.removeItem('token');
                window.location.href = '../account/login.html';
            }, 2000);
        });

        // 验证原密码
        function validateOldPassword() {
            const oldPassword = document.getElementById('old-password').value;
            const errorElement = document.getElementById('old-password-error');
            
            if(!oldPassword) {
                errorElement.textContent = 'Current password cannot be empty';
                return false;
            }
            
            errorElement.textContent = '';
            return true;
        }

        // 验证新密码
        function validateNewPassword() {
            const newPassword = document.getElementById('new-password').value;
            const errorElement = document.getElementById('new-password-error');
            
            if(!newPassword) {
                errorElement.textContent = 'New password cannot be empty';
                return false;
            }
            
            if(newPassword.length < 6) {
                errorElement.textContent = 'Password must be at least 6 characters';
                return false;
            }
            
            errorElement.textContent = '';
            return true;
        }

        // 验证确认密码
        function validateConfirmPassword() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;
            const errorElement = document.getElementById('confirm-password-error');
            
            if(!confirmPassword) {
                errorElement.textContent = 'Confirm password cannot be empty';
                return false;
            }
            
            if(newPassword !== confirmPassword) {
                errorElement.textContent = 'Passwords do not match';
                return false;
            }
            
            errorElement.textContent = '';
            return true;
        }
    </script>
</body>
</html>
